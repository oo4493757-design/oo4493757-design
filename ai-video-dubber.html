<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14171f">
<title>Free Video Dubber</title>
<style>
:root{color-scheme:dark;--bg:#14171f;--s:#1d222d;--s2:#272d3b;--tx:#e8ecf3;--mu:#98a2b5;--ac:#5cc8ff;--ok:#7ee0a4;--er:#ff8a8a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
h1{font-size:1.5rem;margin:8px 0 2px;letter-spacing:-.01em}
.sub{color:var(--mu);margin:0 0 18px;font-size:.92rem}
.box{background:var(--s);border-radius:14px;padding:14px;margin-bottom:14px}
label{display:block;font-size:.88rem;color:var(--mu);margin:10px 0 4px}
select,input[type=file]{width:100%;background:var(--s2);color:var(--tx);border:0;border-radius:10px;padding:12px;font:inherit}
input[type=range]{width:100%;accent-color:var(--ac)}
.row{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.92rem}
.row input{width:20px;height:20px;accent-color:var(--ac)}
video{width:100%;border-radius:12px;background:#000;max-height:46vh;display:block}
button,.dl{display:block;width:100%;border:0;border-radius:12px;padding:15px;font:inherit;font-weight:650;background:var(--ac);color:#06202e;text-align:center;text-decoration:none;margin-top:12px}
button:disabled{opacity:.45}
.bar{height:8px;background:var(--s2);border-radius:8px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
#st{font-size:.9rem;color:var(--mu);margin-top:8px;min-height:1.3em;word-break:break-word}
#st.err{color:var(--er)}
#segs{max-height:260px;overflow:auto;font-size:.86rem}
#segs div{padding:7px 0;border-top:1px solid var(--s2)}
#segs b{color:var(--ac);font-weight:600}
#segs small{color:var(--mu);display:block}
.hide{display:none}
.note{font-size:.8rem;color:var(--mu);margin-top:8px}
</style>
</head>
<body>
<main>
<h1>Free Video Dubber</h1>
<p class="sub">Runs on your phone. No account, no upload, no limits.</p>

<div class="box">
  <label for="f">Video</label>
  <input id="f" type="file" accept="video/*">
  <video id="v" playsinline controls class="hide"></video>

  <label for="lang">Dub into</label>
  <select id="lang"></select>

  <label for="mdl">Listening accuracy</label>
  <select id="mdl">
    <option value="tiny">Fast (tiny model, about 40 MB)</option>
    <option value="base">Better (base model, about 80 MB)</option>
  </select>

  <label for="duck">Original sound under the voice: <span id="dv">25</span>%</label>
  <input id="duck" type="range" min="0" max="60" value="25">
  <div class="row"><input id="vr" type="checkbox"><label for="vr" style="margin:0;color:var(--tx)">Strip original voices from stereo music</label></div>

  <button id="go" disabled>Dub video</button>
  <div class="bar"><i id="pb"></i></div>
  <div id="st">Choose a video to begin.</div>
</div>

<div class="box hide" id="segBox">
  <div style="font-weight:650;margin-bottom:6px">Detected speech</div>
  <div id="segs"></div>
</div>

<div class="box hide" id="resBox">
  <div style="font-weight:650;margin-bottom:8px">Dubbed video</div>
  <video id="out" playsinline controls></video>
  <a id="dl" class="dl">Download dubbed video</a>
  <p class="note">Keep this tab open and the screen on while dubbing. The final step records the video in real time.</p>
</div>
</main>

<script type="module">
const $=s=>document.querySelector(s);
const LANGS={en:['English','eng'],es:['Spanish','spa'],fr:['French','fra'],de:['German','deu'],hi:['Hindi','hin'],ar:['Arabic','ara'],pt:['Portuguese','por'],ru:['Russian','rus'],ko:['Korean','kor'],tr:['Turkish','tur']};
const lang=$('#lang');
for(const k in LANGS)lang.add(new Option(LANGS[k][0],k));
const vid=$('#v'),go=$('#go'),st=$('#st');
let file=null;

$('#duck').oninput=e=>$('#dv').textContent=e.target.value;
$('#f').onchange=e=>{
  file=e.target.files[0];if(!file)return;
  vid.src=URL.createObjectURL(file);vid.classList.remove('hide');
  go.disabled=false;say('Ready. Pick a language and tap Dub video.');setP(0);
};
function say(t,err){st.textContent=t;st.className=err?'err':''}
function setP(p,t){$('#pb').style.width=Math.min(100,p)+'%';if(t)say(t)}

async function loadTF(){
  const m=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2/+esm');
  m.env.useBrowserCache=location.protocol.startsWith('http');
  return m;
}

async function mono16(buf){
  const oc=new OfflineAudioContext(1,Math.ceil(buf.duration*16000),16000);
  const s=oc.createBufferSource();s.buffer=buf;s.connect(oc.destination);s.start();
  return (await oc.startRendering()).getChannelData(0);
}

// Median fundamental frequency of a speech segment (autocorrelation), used to tell male from female voices.
function medianF0(x,sr,s,e){
  const a=Math.floor(s*sr),b=Math.min(x.length,Math.floor(e*sr)),N=1024,H=Math.max(512,Math.floor((b-a-N)/40)),v=[];
  for(let p=a;p+N<=b;p+=H){
    let en=0;for(let i=0;i<N;i++)en+=x[p+i]*x[p+i];
    if(en/N<1e-4)continue;
    let best=0,bl=0;
    for(let l=53;l<=213;l++){let c=0;for(let i=0;i<N-l;i++)c+=x[p+i]*x[p+i+l];if(c>best){best=c;bl=l}}
    if(best/en>.45)v.push(sr/bl);
  }
  v.sort((p,q)=>p-q);return v.length?v[v.length>>1]:0;
}

async function translate(text,tl){
  try{
    const r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl='+tl+'&dt=t&q='+encodeURIComponent(text));
    const j=await r.json();return j[0].map(x=>x[0]).join('');
  }catch(e){
    const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair=autodetect|'+tl);
    return (await r.json()).responseData.translatedText;
  }
}

function mixDown(dur,bed,clips,duckLvl){
  const SR=44100,oc=new OfflineAudioContext(2,Math.ceil(dur*SR),SR);
  const bs=oc.createBufferSource();bs.buffer=bed;
  const g=oc.createGain();g.gain.setValueAtTime(1,0);
  // merge nearby speech regions so the music level moves smoothly, never jumps
  const regs=[];
  for(const c of clips){const l=regs[regs.length-1];if(l&&c.t0-l[1]<.8)l[1]=c.t1;else regs.push([c.t0,c.t1])}
  for(const [a,b] of regs){
    const s=Math.max(.01,a-.15);
    g.gain.setValueAtTime(1,s);g.gain.linearRampToValueAtTime(duckLvl,a);
    g.gain.setValueAtTime(duckLvl,b);g.gain.linearRampToValueAtTime(1,b+.4);
  }
  bs.connect(g).connect(oc.destination);bs.start();
  for(const c of clips){
    const s=oc.createBufferSource();s.buffer=c.buf;s.playbackRate.value=c.rate;
    const cg=oc.createGain();
    cg.gain.setValueAtTime(c.gain,c.t0);
    cg.gain.setValueAtTime(c.gain,Math.max(c.t0,c.t1-.06));cg.gain.linearRampToValueAtTime(0,c.t1);
    s.connect(cg).connect(oc.destination);s.start(c.t0);s.stop(c.t1+.02);
  }
  return oc.startRendering();
}

function record(mix){
  return new Promise(async(res,rej)=>{
    try{
      const ac=new AudioContext(),d=ac.createMediaStreamDestination(),s=ac.createBufferSource();
      s.buffer=mix;s.connect(d);
      vid.pause();vid.muted=true;vid.loop=false;vid.currentTime=0;
      const vs=(vid.captureStream||vid.mozCaptureStream).call(vid);
      const stream=new MediaStream([...vs.getVideoTracks(),...d.stream.getAudioTracks()]);
      const mt=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));
      const rec=new MediaRecorder(stream,{mimeType:mt,videoBitsPerSecond:3e6,audioBitsPerSecond:128e3});
      const ch=[];
      rec.ondataavailable=e=>e.data.size&&ch.push(e.data);
      rec.onstop=()=>{vid.muted=false;vid.ontimeupdate=null;ac.close();res({blob:new Blob(ch,{type:mt.split(';')[0]}),ext:mt.includes('mp4')?'mp4':'webm'})};
      vid.onended=()=>setTimeout(()=>rec.stop(),400);
      vid.ontimeupdate=()=>setP(62+36*vid.currentTime/vid.duration,'Recording dubbed video… '+Math.round(vid.currentTime)+'s / '+Math.round(vid.duration)+'s');
      await ac.resume();rec.start(1000);
      await vid.play();s.start();
    }catch(e){rej(e)}
  });
}

go.onclick=async()=>{
  go.disabled=true;$('#resBox').classList.add('hide');
  let lock;try{lock=await navigator.wakeLock?.request('screen')}catch(e){}
  try{
    const tl=lang.value,dur=vid.duration;
    setP(2,'Reading the audio track…');
    const AC=window.AudioContext||window.webkitAudioContext;
    const full=await new AC().decodeAudioData(await file.arrayBuffer());
    const x=await mono16(full);

    setP(6,'Loading speech model…');
    const {pipeline}=await loadTF();
    const dl=p=>{if(p.status==='progress')say('Downloading '+p.file.split('/').pop()+' '+Math.round(p.progress)+'%')};
    const asr=await pipeline('automatic-speech-recognition','Xenova/whisper-'+$('#mdl').value,{progress_callback:dl});
    setP(14,'Listening to speech…');
    const out=await asr(x,{return_timestamps:true,chunk_length_s:30,stride_length_s:5});
    const segs=out.chunks.map(c=>({s:c.timestamp[0],e:c.timestamp[1]??dur,text:c.text.trim()})).filter(c=>c.text&&c.e>c.s).sort((a,b)=>a.s-b.s);
    if(!segs.length)throw new Error('No speech found in this video.');

    setP(30,'Identifying voices…');
    let last='F';
    for(const sg of segs){
      const f=medianF0(x,16000,sg.s,sg.e);
      sg.f0=f;sg.g=f?(f<165?'M':'F'):last;last=sg.g;
    }

    setP(36,'Translating…');
    for(let i=0;i<segs.length;i++){
      segs[i].tr=await translate(segs[i].text,tl);
      setP(36+10*i/segs.length);
    }
    $('#segBox').classList.remove('hide');
    $('#segs').innerHTML='';
    for(const sg of segs){
      const d=document.createElement('div');
      d.innerHTML='<b></b> <span></span><small></small>';
      d.children[0].textContent=(sg.g==='M'?'Male':'Female')+' '+sg.s.toFixed(1)+'s';
      d.children[1].textContent=sg.tr;d.children[2].textContent=sg.text;
      $('#segs').append(d);
    }

    setP(46,'Loading voice for '+LANGS[tl][0]+'…');
    const tts=await pipeline('text-to-speech','Xenova/mms-tts-'+LANGS[tl][1],{progress_callback:dl});
    const clips=[];let prevEnd=0;
    for(let i=0;i<segs.length;i++){
      setP(46+14*i/segs.length,'Speaking '+(i+1)+' of '+segs.length+'…');
      const sg=segs[i];
      let r;try{r=await tts(sg.tr)}catch(e){continue}
      if(!r.audio.length)continue;
      const buf=new AudioBuffer({length:r.audio.length,sampleRate:r.sampling_rate});
      buf.copyToChannel(r.audio,0);
      let pk=0;for(let k=0;k<r.audio.length;k+=8)pk=Math.max(pk,Math.abs(r.audio[k]));
      const pitch=sg.g==='M'?.86:1.1;
      const t0=Math.max(sg.s,prevEnd+.05);
      const next=segs[i+1];
      const limit=Math.min(dur,next?next.s-.05:dur);
      const slot=Math.max(limit-t0,.4);
      const need=buf.duration/pitch/slot;
      const rate=pitch*Math.min(1.5,Math.max(1,need));
      const t1=t0+Math.min(buf.duration/rate,slot);
      clips.push({buf,rate,t0,t1,gain:Math.min(4,.9/(pk||1))});
      prevEnd=t1;
    }
    if(!clips.length)throw new Error('Voice synthesis produced no audio.');

    setP(60,'Mixing voices with the original soundtrack…');
    let bed=full;
    if($('#vr').checked&&full.numberOfChannels>1){
      bed=new AudioBuffer({numberOfChannels:2,length:full.length,sampleRate:full.sampleRate});
      const L=full.getChannelData(0),R=full.getChannelData(1),m=new Float32Array(full.length);
      for(let i=0;i<m.length;i++)m[i]=(L[i]-R[i])*.6;
      bed.copyToChannel(m,0);bed.copyToChannel(m,1);
    }
    const mix=await mixDown(dur,bed,clips,$('#duck').value/100);

    setP(62,'Recording dubbed video…');
    const {blob,ext}=await record(mix);
    const url=URL.createObjectURL(blob);
    $('#out').src=url;
    const a=$('#dl');a.href=url;a.download='dubbed-'+tl+'.'+ext;
    $('#resBox').classList.remove('hide');
    setP(100,'Done. Preview below, then download.');
    $('#resBox').scrollIntoView({behavior:'smooth'});
  }catch(e){
    console.error(e);say('Failed: '+(e.message||e)+' (large files and weak connections are the usual cause).',true);
  }finally{
    go.disabled=false;try{lock?.release()}catch(e){}
  }
};
</script>
</body>
</html>
